<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="application-name" content="Comic Hub" />
  <meta name="theme-color" content="#08090f" />
  <link rel="icon" href="favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <title>Comic Hub</title>
  <script src="reader-history.js"></script>
  <script>
    (function () {
      var qs = location.search || "";
      var hash = location.hash || "";
      if (qs) {
        var p = new URLSearchParams(qs);
        var data = String(p.get("data") || "").trim();
        if (data) {
          var c = p.get("c") || p.get("chapter");
          var target = c != null && String(c).trim() !== "" ? "reader.html" : "detail.html";
          location.replace(target + qs + hash);
          return;
        }
      }
      if (window.ComicHubHistory && ComicHubHistory.tryRedirectFromHome()) {
        return;
      }
      location.replace("home.html");
    })();
  </script>
</head>
<body>
  <p>Đang chuyển tới <a href="home.html">Comic Hub</a>…</p>
</body>
</html>
