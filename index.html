<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reader</title>
  <style>
    :root {
      --glass: rgba(255, 255, 255, 0.07);
      --glass-strong: rgba(255, 255, 255, 0.11);
      --stroke: rgba(255, 255, 255, 0.14);
      --stroke-soft: rgba(255, 255, 255, 0.08);
      --text: rgba(255, 255, 255, 0.92);
      --text-dim: rgba(255, 255, 255, 0.55);
      --accent: #7af2ff;
      --accent-dim: rgba(122, 242, 255, 0.35);
      --danger: #ff7a7a;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --nav-w: 148px;
      --blur: saturate(1.2) blur(28px);
    }
    * {
      box-sizing: border-box;
    }
    html {
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
        "Segoe UI", Roboto, system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(120% 80% at 50% -10%, #1a2440 0%, #07080c 45%, #030306 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }
    body.has-chapter-progress {
      padding-top: var(--chapter-progress-offset, 0px);
    }
    .glass {
      background: var(--glass);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
    }
    header.shell {
      margin: 10px 12px 0;
      padding: 10px 14px;
      border-radius: var(--radius-lg);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
    }
    header.shell h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    header .meta {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-weight: 500;
    }
    .toolbar {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .btn-ghost,
    .toolbar label.concurrency-wrap,
    .toolbar label.prefetch-wrap {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: var(--glass-strong);
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .toolbar select#loadConcurrencySelect,
    .toolbar select#prefetchAheadSelect {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--stroke-soft);
      background: rgba(0, 0, 0, 0.4);
      color: var(--text);
      cursor: pointer;
      max-width: 6.2rem;
    }
    .toolbar select#prefetchAheadSelect {
      max-width: 7.5rem;
    }
    .toolbar a.tool-link {
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: var(--glass-strong);
      color: var(--text);
      letter-spacing: 0.02em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .layout {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: var(--nav-w) 1fr;
      gap: 10px;
      padding: 10px 12px 16px;
    }
    @media (max-width: 720px) {
      body {
        overflow-x: hidden;
      }
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        padding: 8px 0 0;
        gap: 8px;
      }
      header.shell {
        margin-left: max(12px, env(safe-area-inset-left, 0px));
        margin-right: max(12px, env(safe-area-inset-right, 0px));
      }
      nav.chapter-rail {
        margin-left: max(12px, env(safe-area-inset-left, 0px));
        margin-right: max(12px, env(safe-area-inset-right, 0px));
      }
      main.reader,
      main.reader.glass {
        border-radius: 0;
        padding: 0 !important;
        padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)) !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      .chapter-head {
        max-width: none;
        margin: 0 0 10px;
        padding-left: max(12px, env(safe-area-inset-left, 0px));
        padding-right: max(12px, env(safe-area-inset-right, 0px));
      }
      .pages {
        max-width: none;
        width: 100vw;
        margin-left: calc(50% - 50vw);
        margin-right: calc(50% - 50vw);
      }
      .chapter-footer {
        max-width: none;
        margin: 16px max(12px, env(safe-area-inset-left, 0px)) 0
          max(12px, env(safe-area-inset-right, 0px));
        border-radius: var(--radius-md);
      }
    }
    nav.chapter-rail {
      border-radius: var(--radius-lg);
      padding: 8px 6px;
      overflow: auto;
      max-height: calc(100dvh - 88px);
    }
    @media (max-width: 720px) {
      nav.chapter-rail {
        max-height: none;
        padding: 8px;
      }
      nav.chapter-rail .rail-inner {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 2px;
        scrollbar-width: none;
      }
      nav.chapter-rail .rail-inner::-webkit-scrollbar {
        display: none;
      }
    }
    @media (min-width: 721px) {
      nav.chapter-rail .rail-inner {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
    }
    nav.chapter-rail h2 {
      margin: 0 4px 6px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    @media (max-width: 720px) {
      nav.chapter-rail h2 {
        display: none;
      }
    }
    nav.chapter-rail button.chap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      min-height: 0;
      padding: 5px 8px;
      margin: 0;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      white-space: nowrap;
    }
    @media (max-width: 720px) {
      nav.chapter-rail button.chap {
        width: auto;
        flex: 0 0 auto;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--stroke-soft);
        background: rgba(0, 0, 0, 0.2);
      }
    }
    nav.chapter-rail button.chap:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    nav.chapter-rail button.chap.active {
      border-color: var(--accent-dim);
      background: rgba(122, 242, 255, 0.1);
      box-shadow: inset 0 0 0 1px rgba(122, 242, 255, 0.12);
    }
    nav.chapter-rail button.chap .n {
      opacity: 0.9;
    }
    nav.chapter-rail button.chap .cnt {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-dim);
    }
    nav.chapter-rail button.chap.has-error .cnt {
      color: var(--danger);
    }
    @media (min-width: 721px) {
      main.reader {
        border-radius: var(--radius-lg);
        padding: 14px 12px 24px;
      }
    }
    .chapter-head {
      max-width: 820px;
      margin: 0 auto 12px;
      padding: 0 4px;
    }
    .chapter-head h2 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .chapter-head p {
      margin: 0;
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 500;
    }
    .chapter-load-progress {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      z-index: 200;
      box-sizing: border-box;
      margin: 0;
      padding: env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) 6px
        max(12px, env(safe-area-inset-left, 0px));
      background: rgba(11, 13, 18, 0.92);
      backdrop-filter: blur(16px) saturate(1.1);
      -webkit-backdrop-filter: blur(16px) saturate(1.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .chapter-load-progress .load-progress-inner {
      max-width: 820px;
      margin: 0 auto;
    }
    .load-progress-track {
      position: relative;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45);
    }
    .load-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2ab8e6, var(--accent));
      transition: width 0.35s ease;
      box-shadow: 0 0 14px rgba(122, 242, 255, 0.5);
    }
    .chapter-load-progress.is-loading .load-progress-fill {
      box-shadow: 0 0 20px rgba(122, 242, 255, 0.75);
    }
    .load-progress-busy {
      display: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.35),
        transparent
      );
      background-size: 220% 100%;
      animation: loadbar-sweep 0.85s linear infinite;
      pointer-events: none;
    }
    .chapter-load-progress.is-loading .load-progress-busy {
      display: block;
    }
    @keyframes loadbar-sweep {
      0% {
        background-position: 220% 0;
      }
      100% {
        background-position: -220% 0;
      }
    }
    .load-progress-label {
      margin: 5px 0 0;
      font-size: 0.68rem;
      font-weight: 650;
      color: var(--accent);
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    @media (prefers-reduced-motion: reduce) {
      .load-progress-busy {
        animation: none;
        opacity: 0.35;
      }
    }
    .pages {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0;
      line-height: 0;
    }
    .page-slot {
      position: relative;
      border-radius: 0;
      overflow: hidden;
      background: #000;
      border: none;
      margin: 0;
      padding: 0;
      min-height: 120px;
    }
    .page-slot .shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        transparent 0%,
        rgba(255, 255, 255, 0.05) 45%,
        transparent 90%
      );
      background-size: 200% 100%;
      animation: sh 1.4s ease-in-out infinite;
    }
    @keyframes sh {
      0% {
        background-position: 100% 0;
      }
      100% {
        background-position: -100% 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .page-slot .shimmer {
        animation: none;
        opacity: 0.2;
      }
    }
    .page-slot img {
      display: block;
      position: relative;
      z-index: 1;
      width: 100%;
      height: auto;
      vertical-align: middle;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .page-slot.is-error img {
      pointer-events: none;
    }
    .page-slot img.is-visible {
      opacity: 1;
    }
    .page-slot .err {
      display: none;
      position: absolute;
      z-index: 10;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .page-slot.is-error .err {
      display: flex;
    }
    .page-slot.is-error .shimmer {
      display: none;
    }
    .page-slot .err span {
      font-size: 0.75rem;
      color: var(--text-dim);
      max-width: 260px;
      line-height: 1.4;
    }
    .page-slot .err button {
      font: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: var(--glass-strong);
      color: var(--accent);
      cursor: pointer;
    }
    .chapter-footer {
      max-width: 820px;
      margin: 20px auto 0;
      padding: 12px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .chapter-footer button {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid var(--accent-dim);
      background: rgba(122, 242, 255, 0.12);
      color: var(--accent);
      cursor: pointer;
    }
    .chapter-footer button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .empty,
    .error-box {
      max-width: 460px;
      margin: 2rem auto;
      padding: 1.1rem 1.2rem;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      line-height: 1.55;
      color: var(--text-dim);
    }
    .error-box {
      border-color: rgba(255, 122, 122, 0.4);
      color: var(--danger);
    }
    code {
      font-size: 0.78em;
      padding: 0.12em 0.35em;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--stroke-soft);
    }
    .scroll-top-btn {
      position: fixed;
      z-index: 180;
      right: max(12px, calc(env(safe-area-inset-right, 0px) + 4px));
      bottom: max(14px, calc(env(safe-area-inset-bottom, 0px) + 8px));
      width: 38px;
      height: 38px;
      margin: 0;
      padding: 0;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: saturate(1.15) blur(16px);
      -webkit-backdrop-filter: saturate(1.15) blur(16px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s,
        background 0.15s ease, border-color 0.15s ease;
      pointer-events: none;
    }
    .scroll-top-btn svg {
      display: block;
      flex-shrink: 0;
    }
    .scroll-top-btn.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }
    .scroll-top-btn:hover {
      background: rgba(122, 242, 255, 0.14);
      border-color: var(--accent-dim);
    }
    .scroll-top-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      .scroll-top-btn {
        transition: none;
      }
    }
  </style>
  <!--
    Static hosting (không cần backend):
    1) Đặt index.html + file JSON cùng thư mục trên host; mở /index.html?c=30&data=ten-file.json
    2) Hoặc nhúng JSON: <script type="application/json" id="reader-embedded-data">...</script>
    3) Hoặc trước khi load: window.__READER_MANIFEST__ = { chapters: [...] };
    4) file://: cần nhúng JSON hoặc mở qua host tĩnh / extension local server (trình duyệt chặn fetch file local).
  -->
</head>
<body>
  <header class="shell glass">
    <div>
      <h1 id="appTitle">Reader</h1>
      <div class="meta" id="appMeta"></div>
    </div>
    <div class="toolbar">
      <a class="tool-link glass" href="home.html">Home</a>
      <label class="concurrency-wrap glass" for="loadConcurrencySelect"
        ><span>Tải</span
        ><select id="loadConcurrencySelect" aria-label="Số ảnh tải cùng lúc">
          <option value="1">1 ảnh</option>
          <option value="2">2 ảnh</option>
          <option value="3">3 ảnh</option>
          <option value="5">5 ảnh</option>
        </select></label
      >
      <label class="prefetch-wrap glass" for="prefetchAheadSelect"
        ><span>Tải trước</span
        ><select id="prefetchAheadSelect" aria-label="Số chương tải trước (ảnh nền)">
          <option value="0">0 chương</option>
          <option value="1">1 chương</option>
          <option value="2">2 chương</option>
          <option value="3">3 chương</option>
        </select></label
      >
    </div>
  </header>
  <div class="layout">
    <nav class="chapter-rail glass" id="chapterNav" aria-label="Chapters"></nav>
    <main class="reader glass" id="main">
      <div class="empty glass" id="placeholder">
        Đang tải dữ liệu… Trên host tĩnh: đặt file JSON cạnh <code>index.html</code> và mở
        <code>?data=delusion-ch30-60.json&c=30</code>, hoặc mở từ <a href="home.html">Home</a> để chọn bộ truyện.
      </div>
    </main>
  </div>
  <button
    type="button"
    class="scroll-top-btn"
    id="scrollTopBtn"
    aria-label="Lên đầu trang"
    aria-hidden="true"
    tabindex="-1"
    title="Lên đầu"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 19V5M5 12l7-7 7 7"
      />
    </svg>
  </button>
  <script>
    (function () {
      const DEFAULT_DATA_FILE = "delusion-ch30-60.json";
      const PARAM_DATA = "data";
      const PARAM_CHAPTER = "c";
      const PARAM_CHAPTER_ALT = "chapter";
      const LS_LOAD_CONCURRENCY = "reader-load-concurrency";
      const LS_PREFETCH_AHEAD = "reader-prefetch-chapters-ahead";

      function getLoadConcurrency() {
        const raw = localStorage.getItem(LS_LOAD_CONCURRENCY);
        const n = parseInt(raw, 10);
        if (n === 2 || n === 3 || n === 5) return n;
        return 1;
      }

      function setLoadConcurrency(n) {
        const v = n === 2 || n === 3 || n === 5 ? n : 1;
        localStorage.setItem(LS_LOAD_CONCURRENCY, String(v));
        return v;
      }

      function getPrefetchChaptersAhead() {
        const raw = localStorage.getItem(LS_PREFETCH_AHEAD);
        const n = parseInt(raw, 10);
        if (n === 1 || n === 2 || n === 3) return n;
        return 0;
      }

      function setPrefetchChaptersAhead(n) {
        const v = n === 1 || n === 2 || n === 3 ? n : 0;
        localStorage.setItem(LS_PREFETCH_AHEAD, String(v));
        return v;
      }

      function removeChapterProgressBar() {
        document.getElementById("chapterLoadProgress")?.remove();
        document.body.classList.remove("has-chapter-progress");
        document.documentElement.style.removeProperty("--chapter-progress-offset");
      }

      function syncChapterProgressBodyOffset() {
        const bar = document.getElementById("chapterLoadProgress");
        if (!bar || !document.body.classList.contains("has-chapter-progress")) {
          document.documentElement.style.removeProperty("--chapter-progress-offset");
          return;
        }
        const h = Math.ceil(bar.getBoundingClientRect().height);
        document.documentElement.style.setProperty("--chapter-progress-offset", h + "px");
      }

      window.addEventListener("resize", syncChapterProgressBodyOffset);
      window.addEventListener("orientationchange", syncChapterProgressBodyOffset);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(syncChapterProgressBodyOffset);
      }

      const el = {
        nav: document.getElementById("chapterNav"),
        main: document.getElementById("main"),
        title: document.getElementById("appTitle"),
        meta: document.getElementById("appMeta"),
        placeholder: document.getElementById("placeholder"),
        concurrencySelect: document.getElementById("loadConcurrencySelect"),
        prefetchAheadSelect: document.getElementById("prefetchAheadSelect"),
        scrollTopBtn: document.getElementById("scrollTopBtn"),
      };

      const SCROLL_TOP_SHOW_AT = 120;

      function prefersReducedMotion() {
        return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }

      /** Cuộn thực tế: có thể là main.reader hoặc document (trước khi khóa body). */
      function getReaderScrollY() {
        const doc = document.documentElement;
        const body = document.body;
        const winY =
          window.scrollY ?? window.pageYOffset ?? doc.scrollTop ?? body.scrollTop ?? 0;
        return Math.max(el.main.scrollTop || 0, winY);
      }

      function syncScrollTopBtnVisibility() {
        if (!el.scrollTopBtn) return;
        const show = getReaderScrollY() > SCROLL_TOP_SHOW_AT;
        el.scrollTopBtn.classList.toggle("is-visible", show);
        el.scrollTopBtn.setAttribute("aria-hidden", show ? "false" : "true");
        el.scrollTopBtn.tabIndex = show ? 0 : -1;
      }

      function scrollReaderToTopSmooth() {
        const behavior = prefersReducedMotion() ? "auto" : "smooth";
        el.main.scrollTo({ top: 0, left: 0, behavior });
        window.scrollTo({ top: 0, left: 0, behavior });
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      }

      if (el.scrollTopBtn) {
        el.scrollTopBtn.addEventListener("click", function () {
          scrollReaderToTopSmooth();
        });
        el.main.addEventListener("scroll", syncScrollTopBtnVisibility, { passive: true });
        window.addEventListener("scroll", syncScrollTopBtnVisibility, { passive: true });
        window.addEventListener("resize", syncScrollTopBtnVisibility);
        syncScrollTopBtnVisibility();
      }

      if (el.concurrencySelect) {
        el.concurrencySelect.value = String(getLoadConcurrency());
        el.concurrencySelect.addEventListener("change", function () {
          const v = setLoadConcurrency(parseInt(el.concurrencySelect.value, 10));
          el.concurrencySelect.value = String(v);
          if (data != null && activeIndex >= 0) {
            setActive(activeIndex);
          }
        });
      }

      if (el.prefetchAheadSelect) {
        el.prefetchAheadSelect.value = String(getPrefetchChaptersAhead());
        el.prefetchAheadSelect.addEventListener("change", function () {
          const v = setPrefetchChaptersAhead(parseInt(el.prefetchAheadSelect.value, 10));
          el.prefetchAheadSelect.value = String(v);
          if (getPrefetchChaptersAhead() > 0 && isCurrentChapterViewFullyLoaded()) {
            prefetchFollowingChapterImages(activeIndex, sequentialToken);
          }
        });
      }

      let data = null;
      let activeIndex = -1;
      let dataFileName = DEFAULT_DATA_FILE;
      let sequentialToken = 0;
      /** Khi true: chỉ ghi ?c= lên URL (không ghi ?data=), dùng cho JSON chọn từ máy / nhúng. */
      let omitDataParamInUrl = false;

      function currentParams() {
        return new URLSearchParams(location.search);
      }

      /** Thư mục chứa index.html (GitHub Pages: /Repo vs /Repo/ đều ổn). */
      function getManifestBaseDir() {
        const path = location.pathname || "/";
        if (path.endsWith("/")) {
          return location.origin + path;
        }
        const slash = path.lastIndexOf("/");
        const lastSeg = path.slice(slash + 1);
        if (lastSeg.includes(".")) {
          return location.origin + path.slice(0, slash + 1);
        }
        return location.origin + path + "/";
      }

      function resolveManifestUrl(fileName) {
        const name = String(fileName || "").trim();
        if (!name || /^https?:\/\//i.test(name)) {
          return name;
        }
        return new URL(name, getManifestBaseDir()).href;
      }

      function getDataFileFromUrl() {
        const p = currentParams();
        const d = p.get(PARAM_DATA);
        return d && d.trim() ? d.trim() : DEFAULT_DATA_FILE;
      }

      function getChapterQueryNumber() {
        const p = currentParams();
        const raw = p.get(PARAM_CHAPTER) || p.get(PARAM_CHAPTER_ALT);
        if (raw == null || raw === "") return null;
        const n = parseInt(String(raw), 10);
        return Number.isFinite(n) ? n : null;
      }

      function getChapterFromHash() {
        const m = location.hash.match(/^#c(\d+)$/i);
        return m ? parseInt(m[1], 10) : null;
      }

      function syncUrl() {
        if (!data || activeIndex < 0) return;
        const ch = data.chapters[activeIndex];
        if (!ch || ch.chapter == null) return;
        const u = new URL(location.href);
        u.searchParams.set(PARAM_CHAPTER, String(ch.chapter));
        if (omitDataParamInUrl) {
          u.searchParams.delete(PARAM_DATA);
        } else {
          u.searchParams.set(PARAM_DATA, dataFileName);
        }
        u.hash = "";
        const next = u.pathname + u.search;
        if (next !== location.pathname + location.search) {
          history.replaceState(null, "", next);
        }
      }

      function parseJson(text) {
        const j = JSON.parse(text);
        if (!j || !Array.isArray(j.chapters)) {
          throw new Error('JSON thiếu mảng "chapters".');
        }
        return j;
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function bustUrl(src) {
        try {
          const u = new URL(src, location.href);
          u.searchParams.set("_r", String(Date.now()));
          return u.href;
        } catch {
          return src + (src.indexOf("?") >= 0 ? "&" : "?") + "_r=" + Date.now();
        }
      }

      function loadManifestEmbedded() {
        const node = document.getElementById("reader-embedded-data");
        if (!node || !node.textContent || !node.textContent.trim()) return null;
        return parseJson(node.textContent.trim());
      }

      function loadManifestWindow() {
        if (typeof window.__READER_MANIFEST__ === "object" && window.__READER_MANIFEST__ !== null) {
          const j = window.__READER_MANIFEST__;
          if (!Array.isArray(j.chapters)) throw new Error('__READER_MANIFEST__ thiếu "chapters".');
          return j;
        }
        return null;
      }

      async function loadManifestFetch(fileName) {
        const url = resolveManifestUrl(fileName);
        const res = await fetch(url, {
          credentials: "same-origin",
          cache: "no-store",
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return parseJson(await res.text());
      }

      function scrollReaderToTop() {
        el.main.scrollTop = 0;
        window.scrollTo({ top: 0, left: 0, behavior: "auto" });
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        syncScrollTopBtnVisibility();
        requestAnimationFrame(function () {
          el.main.scrollTop = 0;
          window.scrollTo(0, 0);
          syncScrollTopBtnVisibility();
        });
      }

      function setActive(index) {
        if (!data || index < 0 || index >= data.chapters.length) return;
        activeIndex = index;
        let activeBtn = null;
        el.nav.querySelectorAll("button.chap").forEach((btn, i) => {
          btn.classList.toggle("active", i === index);
          if (i === index) activeBtn = btn;
        });
        sequentialToken += 1;
        renderChapter(sequentialToken);
        syncUrl();
        scrollReaderToTop();
        if (activeBtn) {
          activeBtn.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
        }
      }

      function renderNav() {
        el.nav.innerHTML = "";
        const h2 = document.createElement("h2");
        h2.textContent = "Chương";
        el.nav.appendChild(h2);
        const rail = document.createElement("div");
        rail.className = "rail-inner";

        data.chapters.forEach((ch, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "chap";
          if (ch.error) btn.classList.add("has-error");
          const num = ch.chapter != null ? ch.chapter : i + 1;
          const total = typeof ch.total === "number" ? ch.total : (ch.images || []).length;
          btn.innerHTML =
            '<span class="n">Ch.' +
            escapeHtml(String(num)) +
            '</span><span class="cnt">' +
            total +
            (ch.error ? " !" : "") +
            "</span>";
          btn.addEventListener("click", () => setActive(i));
          rail.appendChild(btn);
        });
        el.nav.appendChild(rail);
      }

      /**
       * Tải trước ảnh chương kế (Image ngoài DOM) để vào HTTP cache; không bơm URL mới khi cancelToken !== sequentialToken.
       */
      function prefetchChapterImages(urls, cancelToken) {
        const list = [];
        for (let u = 0; u < urls.length; u++) {
          const s = urls[u];
          if (typeof s !== "string" || !s.trim()) continue;
          if (/^data:/i.test(s)) continue;
          list.push(s);
        }
        if (!list.length) return;
        const maxP = Math.max(1, Math.min(3, getLoadConcurrency()));
        let i = 0;
        let inflight = 0;
        function pump() {
          if (cancelToken !== sequentialToken) return;
          while (inflight < maxP && i < list.length) {
            const src = list[i++];
            inflight++;
            const im = new Image();
            im.referrerPolicy = "no-referrer";
            im.decoding = "async";
            function step() {
              if (cancelToken !== sequentialToken) return;
              inflight--;
              pump();
            }
            im.onload = step;
            im.onerror = step;
            im.src = src;
          }
        }
        pump();
      }

      /** Ghép URL ảnh của tối đa k chương ngay sau fromActiveIndex, rồi prefetch (cache). */
      function prefetchFollowingChapterImages(fromActiveIndex, cancelToken) {
        const k = getPrefetchChaptersAhead();
        if (k <= 0 || !data || fromActiveIndex < 0) return;
        const flat = [];
        for (let j = 1; j <= k; j++) {
          const idx = fromActiveIndex + j;
          if (idx >= data.chapters.length) break;
          const imgs = Array.isArray(data.chapters[idx].images) ? data.chapters[idx].images : [];
          for (let u = 0; u < imgs.length; u++) flat.push(imgs[u]);
        }
        prefetchChapterImages(flat, cancelToken);
      }

      function isCurrentChapterViewFullyLoaded() {
        if (!data || activeIndex < 0) return false;
        const slots = el.main.querySelectorAll(".page-slot");
        if (!slots.length) return false;
        for (let si = 0; si < slots.length; si++) {
          const s = slots[si];
          if (s.classList.contains("is-error")) return false;
          if (!s.querySelector("img.is-visible")) return false;
        }
        return true;
      }

      function renderChapter(token) {
        if (!data || activeIndex < 0 || activeIndex >= data.chapters.length) return;

        removeChapterProgressBar();

        const ch = data.chapters[activeIndex];
        const images = Array.isArray(ch.images) ? ch.images : [];
        const title = ch.title || "Chapter " + (ch.chapter ?? activeIndex + 1);

        el.main.innerHTML = "";

        const head = document.createElement("div");
        head.className = "chapter-head";
        const maxC = getLoadConcurrency();
        const modeLabel =
          maxC === 1
            ? "tuần tự (1 ảnh)"
            : "song song tối đa " + maxC + " ảnh";
        head.innerHTML =
          "<h2>" +
          escapeHtml(title) +
          "</h2><p>" +
          images.length +
          " trang · " +
          modeLabel +
          (ch.error ? " · " + escapeHtml(ch.error) : "") +
          "</p>";
        el.main.appendChild(head);

        if (images.length === 0) {
          removeChapterProgressBar();
          const empty = document.createElement("p");
          empty.className = "empty glass";
          empty.textContent = "Chapter không có ảnh.";
          el.main.appendChild(empty);
          return;
        }

        const progressWrap = document.createElement("div");
        progressWrap.id = "chapterLoadProgress";
        progressWrap.className = "chapter-load-progress is-loading";
        const progressInner = document.createElement("div");
        progressInner.className = "load-progress-inner";
        const track = document.createElement("div");
        track.className = "load-progress-track";
        const fill = document.createElement("div");
        fill.className = "load-progress-fill";
        const busy = document.createElement("div");
        busy.className = "load-progress-busy";
        const progressLabel = document.createElement("p");
        progressLabel.className = "load-progress-label";
        track.appendChild(fill);
        track.appendChild(busy);
        progressInner.appendChild(track);
        progressInner.appendChild(progressLabel);
        progressWrap.appendChild(progressInner);
        document.body.appendChild(progressWrap);
        document.body.classList.add("has-chapter-progress");
        syncChapterProgressBodyOffset();
        requestAnimationFrame(function () {
          syncChapterProgressBodyOffset();
        });

        const pages = document.createElement("div");
        pages.className = "pages";

        let nextSchedule = 0;
        let inFlight = 0;
        const completed = new Set();
        let prefetchNextStarted = false;

        function tryPrefetchNextChapterIfComplete() {
          if (prefetchNextStarted || token !== sequentialToken) return;
          const total = images.length;
          const done = completed.size;
          const anyErr = pages.querySelector(".page-slot.is-error") !== null;
          if (done < total || inFlight > 0 || anyErr) return;
          if (getPrefetchChaptersAhead() <= 0) return;
          if (!data || activeIndex + 1 >= data.chapters.length) return;
          prefetchNextStarted = true;
          const cancelToken = sequentialToken;
          setTimeout(function () {
            if (cancelToken !== sequentialToken) return;
            prefetchFollowingChapterImages(activeIndex, cancelToken);
          }, 0);
        }

        function updateProgressUI() {
          const total = images.length;
          const done = completed.size;
          const pct = total ? Math.min(100, (done / total) * 100) : 0;
          fill.style.width = pct + "%";
          const anyErr = pages.querySelector(".page-slot.is-error") !== null;
          const stillGoing =
            inFlight > 0 || (nextSchedule < total && done < total);

          if (done >= total && inFlight === 0 && !anyErr) {
            progressWrap.classList.remove("is-loading");
            progressLabel.textContent = "Đã tải xong " + total + " trang.";
            tryPrefetchNextChapterIfComplete();
            return;
          }

          if (anyErr && !stillGoing && done < total) {
            progressWrap.classList.remove("is-loading");
            progressLabel.textContent =
              "Đã " +
              done +
              " / " +
              total +
              " trang — có lỗi, bấm Tải lại tại trang đó";
            return;
          }

          progressWrap.classList.toggle("is-loading", stillGoing);
          if (stillGoing) {
            progressLabel.textContent =
              "Đang tải · " +
              done +
              " / " +
              total +
              " trang xong · tối đa " +
              maxC +
              " ảnh cùng lúc";
          } else if (done >= total) {
            progressWrap.classList.remove("is-loading");
            progressLabel.textContent = "Đã tải xong " + total + " trang.";
            tryPrefetchNextChapterIfComplete();
          }
        }

        function scheduleNext() {
          if (token !== sequentialToken) return;
          while (inFlight < maxC && nextSchedule < images.length) {
            const idx = nextSchedule++;
            startLoadAt(idx, images[idx]);
          }
          updateProgressUI();
        }

        function startLoadAt(index, imageUrl) {
          if (token !== sequentialToken) return;
          inFlight++;

          const slot = pages.children[index];
          if (!slot) {
            inFlight--;
            scheduleNext();
            return;
          }
          const errEl = slot.querySelector(".err");
          const shimmer = slot.querySelector(".shimmer");

          slot.classList.remove("is-error");
          if (shimmer) shimmer.style.display = "";

          const prevImg = slot.querySelector("img");
          if (prevImg) prevImg.remove();

          const img = document.createElement("img");
          img.alt = title + " — " + (index + 1);
          img.referrerPolicy = "no-referrer";
          img.decoding = "async";
          slot.insertBefore(img, errEl);

          img.onload = function () {
            if (token !== sequentialToken) return;
            inFlight--;
            completed.add(index);
            if (shimmer) shimmer.style.display = "none";
            img.classList.add("is-visible");
            updateProgressUI();
            scheduleNext();
          };
          img.onerror = function () {
            if (token !== sequentialToken) return;
            inFlight--;
            slot.classList.add("is-error");
            img.classList.remove("is-visible");
            if (shimmer) shimmer.style.display = "none";
            updateProgressUI();
            scheduleNext();
          };

          updateProgressUI();
          img.src = "";
          img.src = imageUrl;
        }

        images.forEach((src, idx) => {
          const slot = document.createElement("div");
          slot.className = "page-slot";
          slot.dataset.index = String(idx);

          const shimmer = document.createElement("div");
          shimmer.className = "shimmer";
          slot.appendChild(shimmer);

          const err = document.createElement("div");
          err.className = "err";
          err.innerHTML =
            "<span>Không tải được trang " + (idx + 1) + ".</span>";
          const retry = document.createElement("button");
          retry.type = "button";
          retry.textContent = "Tải lại ảnh này";
          err.appendChild(retry);
          slot.appendChild(err);

          retry.addEventListener("click", function (ev) {
            ev.preventDefault();
            ev.stopPropagation();
            startLoadAt(idx, bustUrl(images[idx]));
          });

          pages.appendChild(slot);
        });

        el.main.appendChild(pages);

        if (activeIndex < data.chapters.length - 1) {
          const footer = document.createElement("div");
          footer.className = "chapter-footer glass";
          const nextBtn = document.createElement("button");
          nextBtn.type = "button";
          const nextCh = data.chapters[activeIndex + 1];
          const nn = nextCh.chapter != null ? nextCh.chapter : activeIndex + 2;
          nextBtn.textContent = "Chương tiếp — Ch." + nn;
          nextBtn.addEventListener("click", () => setActive(activeIndex + 1));
          footer.appendChild(nextBtn);
          el.main.appendChild(footer);
        }

        nextSchedule = 0;
        inFlight = 0;
        completed.clear();
        scheduleNext();
      }

      function resolveStartChapter(j) {
        const q = getChapterQueryNumber();
        if (q != null) {
          const found = j.chapters.findIndex((c) => c.chapter === q);
          if (found >= 0) return found;
        }
        const h = getChapterFromHash();
        if (h != null) {
          const found = j.chapters.findIndex((c) => c.chapter === h);
          if (found >= 0) return found;
        }
        return 0;
      }

      function applyData(j, opts) {
        data = j;
        if (opts && opts.fromFile) {
          omitDataParamInUrl = true;
          if (opts.fileName) dataFileName = opts.fileName;
        } else if (opts && opts.fromWindowOrEmbed) {
          omitDataParamInUrl = true;
          dataFileName = "(nhúng)";
        } else if (opts && opts.manifestFile) {
          omitDataParamInUrl = false;
          dataFileName = opts.manifestFile;
        } else {
          omitDataParamInUrl = false;
          dataFileName = getDataFileFromUrl();
        }

        const from = j.fromChapter;
        const to = j.toChapter;
        el.title.textContent =
          from != null && to != null ? "Ch." + from + " – " + to : "Reader";

        const parts = [];
        if (j.fetchedAt) {
          parts.push(new Date(j.fetchedAt).toLocaleDateString());
        }
        parts.push(j.chapters.length + " chương");
        parts.push("data=" + dataFileName);
        el.meta.textContent = parts.join(" · ");

        renderNav();
        setActive(resolveStartChapter(j));
      }

      function showMainError(msg) {
        removeChapterProgressBar();
        el.main.innerHTML = '<div class="error-box glass">' + escapeHtml(msg) + "</div>";
        syncScrollTopBtnVisibility();
      }

      async function init() {
        dataFileName = getDataFileFromUrl();

        try {
          const w = loadManifestWindow();
          if (w) {
            applyData(w, { fromWindowOrEmbed: true });
            return;
          }
        } catch (e) {
          showMainError(e.message || String(e));
          return;
        }

        try {
          const emb = loadManifestEmbedded();
          if (emb) {
            applyData(emb, { fromWindowOrEmbed: true });
            return;
          }
        } catch (e) {
          showMainError(e.message || String(e));
          return;
        }

        try {
          const manifestFile = getDataFileFromUrl();
          dataFileName = manifestFile;
          const j = await loadManifestFetch(manifestFile);
          applyData(j, { manifestFile: manifestFile });
          return;
        } catch {
          /* fetch thất bại — thường là file:// */
        }

        removeChapterProgressBar();
        el.main.innerHTML = "";
        el.main.appendChild(el.placeholder);
        el.placeholder.innerHTML =
          "Không fetch được <code>" +
          escapeHtml(dataFileName) +
          "</code> (bình thường khi mở <code>file://</code>). " +
          "Trên hosting tĩnh, thêm file JSON cạnh <code>index.html</code> hoặc dùng " +
          "<code>?data=ten-file.json&c=30</code>. " +
          "Hoặc nhúng <code>&lt;script type=\"application/json\" id=\"reader-embedded-data\"&gt;</code> / <code>window.__READER_MANIFEST__</code>.";
        syncScrollTopBtnVisibility();
      }

      init();
    })();
  </script>
</body>
</html>
