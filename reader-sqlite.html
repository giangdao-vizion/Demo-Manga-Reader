<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reader · SQLite</title>
  <style>
    :root {
      --glass: rgba(255, 255, 255, 0.07);
      --glass-strong: rgba(255, 255, 255, 0.11);
      --stroke: rgba(255, 255, 255, 0.14);
      --stroke-soft: rgba(255, 255, 255, 0.08);
      --text: rgba(255, 255, 255, 0.92);
      --text-dim: rgba(255, 255, 255, 0.55);
      --accent: #7af2ff;
      --accent-dim: rgba(122, 242, 255, 0.35);
      --danger: #ff7a7a;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --nav-w: 148px;
      --blur: saturate(1.2) blur(28px);
    }
    * {
      box-sizing: border-box;
    }
    html {
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
        "Segoe UI", Roboto, system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(120% 80% at 50% -10%, #1a2440 0%, #07080c 45%, #030306 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }
    body.has-chapter-progress {
      padding-top: var(--chapter-progress-offset, 0px);
    }
    .glass {
      background: var(--glass);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
    }
    header.shell {
      margin: 10px 12px 0;
      padding: 10px 14px;
      border-radius: var(--radius-lg);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
    }
    header.shell h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    header .meta {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-weight: 500;
    }
    .toolbar {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .btn-ghost,
    .toolbar label.concurrency-wrap,
    .toolbar label.prefetch-wrap {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: var(--glass-strong);
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .toolbar select#loadConcurrencySelect,
    .toolbar select#prefetchAheadSelect {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--stroke-soft);
      background: rgba(0, 0, 0, 0.4);
      color: var(--text);
      cursor: pointer;
      max-width: 6.2rem;
    }
    .toolbar select#prefetchAheadSelect {
      max-width: 7.5rem;
    }
    .toolbar a.tool-link {
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: var(--glass-strong);
      color: var(--text);
      letter-spacing: 0.02em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .layout {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: var(--nav-w) 1fr;
      gap: 10px;
      padding: 10px 12px 16px;
    }
    @media (max-width: 720px) {
      body {
        overflow-x: hidden;
      }
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        padding: 8px 0 0;
        gap: 8px;
      }
      header.shell {
        margin-left: max(12px, env(safe-area-inset-left, 0px));
        margin-right: max(12px, env(safe-area-inset-right, 0px));
      }
      nav.chapter-rail {
        margin-left: max(12px, env(safe-area-inset-left, 0px));
        margin-right: max(12px, env(safe-area-inset-right, 0px));
      }
      main.reader,
      main.reader.glass {
        border-radius: 0;
        padding: 0 !important;
        padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)) !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      .chapter-head {
        max-width: none;
        margin: 0 0 10px;
        padding-left: max(12px, env(safe-area-inset-left, 0px));
        padding-right: max(12px, env(safe-area-inset-right, 0px));
      }
      .pages {
        max-width: none;
        width: 100vw;
        margin-left: calc(50% - 50vw);
        margin-right: calc(50% - 50vw);
      }
      .chapter-footer {
        max-width: none;
        margin: 16px max(12px, env(safe-area-inset-left, 0px)) 0
          max(12px, env(safe-area-inset-right, 0px));
        border-radius: var(--radius-md);
      }
    }
    nav.chapter-rail {
      border-radius: var(--radius-lg);
      padding: 8px 6px;
      overflow: auto;
      max-height: calc(100dvh - 88px);
    }
    @media (max-width: 720px) {
      nav.chapter-rail {
        max-height: none;
        padding: 8px;
      }
      nav.chapter-rail .rail-inner {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 2px;
        scrollbar-width: none;
      }
      nav.chapter-rail .rail-inner::-webkit-scrollbar {
        display: none;
      }
    }
    @media (min-width: 721px) {
      nav.chapter-rail .rail-inner {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
    }
    nav.chapter-rail h2 {
      margin: 0 4px 6px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    @media (max-width: 720px) {
      nav.chapter-rail h2 {
        display: none;
      }
    }
    nav.chapter-rail button.chap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      min-height: 0;
      padding: 5px 8px;
      margin: 0;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      white-space: nowrap;
    }
    @media (max-width: 720px) {
      nav.chapter-rail button.chap {
        width: auto;
        flex: 0 0 auto;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--stroke-soft);
        background: rgba(0, 0, 0, 0.2);
      }
    }
    nav.chapter-rail button.chap:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    nav.chapter-rail button.chap.active {
      border-color: var(--accent-dim);
      background: rgba(122, 242, 255, 0.1);
      box-shadow: inset 0 0 0 1px rgba(122, 242, 255, 0.12);
    }
    nav.chapter-rail button.chap .n {
      opacity: 0.9;
    }
    nav.chapter-rail button.chap .cnt {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-dim);
    }
    nav.chapter-rail button.chap.has-error .cnt {
      color: var(--danger);
    }
    nav.chapter-rail button.chap .read-check {
      flex-shrink: 0;
      margin-right: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    @media (min-width: 721px) {
      main.reader {
        border-radius: var(--radius-lg);
        padding: 14px 12px 24px;
      }
    }
    .chapter-head {
      max-width: 820px;
      margin: 0 auto 12px;
      padding: 0 4px;
    }
    .chapter-head h2 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .chapter-head p {
      margin: 0;
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 500;
    }
    .chapter-load-progress {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      z-index: 200;
      box-sizing: border-box;
      margin: 0;
      padding: env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) 6px
        max(12px, env(safe-area-inset-left, 0px));
      background: rgba(11, 13, 18, 0.92);
      backdrop-filter: blur(16px) saturate(1.1);
      -webkit-backdrop-filter: blur(16px) saturate(1.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .chapter-load-progress .load-progress-inner {
      max-width: 820px;
      margin: 0 auto;
    }
    .load-progress-track {
      position: relative;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45);
    }
    .load-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2ab8e6, var(--accent));
      transition: width 0.35s ease;
      box-shadow: 0 0 14px rgba(122, 242, 255, 0.5);
    }
    .chapter-load-progress.is-loading .load-progress-fill {
      box-shadow: 0 0 20px rgba(122, 242, 255, 0.75);
    }
    .load-progress-busy {
      display: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.35),
        transparent
      );
      background-size: 220% 100%;
      animation: loadbar-sweep 0.85s linear infinite;
      pointer-events: none;
    }
    .chapter-load-progress.is-loading .load-progress-busy {
      display: block;
    }
    @keyframes loadbar-sweep {
      0% {
        background-position: 220% 0;
      }
      100% {
        background-position: -220% 0;
      }
    }
    .load-progress-label {
      margin: 5px 0 0;
      font-size: 0.68rem;
      font-weight: 650;
      color: var(--accent);
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    @media (prefers-reduced-motion: reduce) {
      .load-progress-busy {
        animation: none;
        opacity: 0.35;
      }
    }
    .pages {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0;
      line-height: 0;
    }
    .page-slot {
      position: relative;
      border-radius: 0;
      overflow: hidden;
      background: #000;
      border: none;
      margin: 0;
      padding: 0;
      min-height: 120px;
    }
    .page-slot .shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        transparent 0%,
        rgba(255, 255, 255, 0.05) 45%,
        transparent 90%
      );
      background-size: 200% 100%;
      animation: sh 1.4s ease-in-out infinite;
    }
    @keyframes sh {
      0% {
        background-position: 100% 0;
      }
      100% {
        background-position: -100% 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .page-slot .shimmer {
        animation: none;
        opacity: 0.2;
      }
    }
    .page-slot img {
      display: block;
      position: relative;
      z-index: 1;
      width: 100%;
      height: auto;
      vertical-align: middle;
      opacity: 0;
      transition: opacity 0.35s ease;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .page-slot,
    .page-slot * {
      -webkit-user-select: none;
      user-select: none;
    }
    .page-slot.is-error img {
      pointer-events: none;
    }
    .page-slot img.is-visible {
      opacity: 1;
    }
    .page-slot .err {
      display: none;
      position: absolute;
      z-index: 10;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .page-slot.is-error .err {
      display: flex;
    }
    .page-slot.is-error .shimmer {
      display: none;
    }
    .page-slot .err span {
      font-size: 0.75rem;
      color: var(--text-dim);
      max-width: 260px;
      line-height: 1.4;
    }
    .page-slot .err button {
      font: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: var(--glass-strong);
      color: var(--accent);
      cursor: pointer;
    }
    .chapter-footer {
      max-width: 820px;
      margin: 20px auto 0;
      padding: 12px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .chapter-footer button {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid var(--accent-dim);
      background: rgba(122, 242, 255, 0.12);
      color: var(--accent);
      cursor: pointer;
    }
    .chapter-footer button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .empty,
    .error-box {
      max-width: 460px;
      margin: 2rem auto;
      padding: 1.1rem 1.2rem;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      line-height: 1.55;
      color: var(--text-dim);
    }
    .error-box {
      border-color: rgba(255, 122, 122, 0.4);
      color: var(--danger);
    }
    code {
      font-size: 0.78em;
      padding: 0.12em 0.35em;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--stroke-soft);
    }
    .scroll-top-btn {
      position: fixed;
      z-index: 180;
      right: max(12px, calc(env(safe-area-inset-right, 0px) + 4px));
      bottom: max(14px, calc(env(safe-area-inset-bottom, 0px) + 8px));
      width: 38px;
      height: 38px;
      margin: 0;
      padding: 0;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: saturate(1.15) blur(16px);
      -webkit-backdrop-filter: saturate(1.15) blur(16px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s,
        background 0.15s ease, border-color 0.15s ease;
      pointer-events: none;
    }
    .scroll-top-btn svg {
      display: block;
      flex-shrink: 0;
    }
    .scroll-top-btn.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }
    .scroll-top-btn:hover {
      background: rgba(122, 242, 255, 0.14);
      border-color: var(--accent-dim);
    }
    .scroll-top-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      .scroll-top-btn {
        transition: none;
      }
    }
    .read-scroll-pill {
      position: fixed;
      z-index: 170;
      left: max(12px, calc(env(safe-area-inset-left, 0px) + 4px));
      bottom: max(14px, calc(env(safe-area-inset-bottom, 0px) + 8px));
      margin: 0;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(11, 13, 18, 0.88);
      backdrop-filter: saturate(1.15) blur(14px);
      -webkit-backdrop-filter: saturate(1.15) blur(14px);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35);
      font-size: 0.72rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      letter-spacing: 0.04em;
      pointer-events: none;
      min-width: 2.75rem;
      text-align: center;
    }
    .read-scroll-pill[hidden] {
      display: none !important;
    }
  </style>
  <!--
    Dữ liệu từ SQLite qua catalog view-server:
      npm run catalog:view
      http://127.0.0.1:4567/reader-sqlite.html?seriesId=1&c=30
    Cần đã catalog:sync + đồng bộ nội dung (chapter/ảnh) cho bộ đó.
  -->
</head>
<body>
  <header class="shell glass">
    <div>
      <h1 id="appTitle">Reader</h1>
      <div class="meta" id="appMeta"></div>
    </div>
    <div class="toolbar">
      <a class="tool-link glass" href="/" title="Về danh sách catalog (SQLite)">← Catalog</a>
      <label class="concurrency-wrap glass" for="loadConcurrencySelect"
        ><span>Tải</span
        ><select id="loadConcurrencySelect" aria-label="Số ảnh tải cùng lúc">
          <option value="1">1 ảnh</option>
          <option value="2">2 ảnh</option>
          <option value="3">3 ảnh</option>
          <option value="5">5 ảnh</option>
        </select></label
      >
      <label class="prefetch-wrap glass" for="prefetchAheadSelect"
        ><span>Tải trước</span
        ><select id="prefetchAheadSelect" aria-label="Số chương tải trước (ảnh nền)">
          <option value="0">0 chương</option>
          <option value="1">1 chương</option>
          <option value="2">2 chương</option>
          <option value="3">3 chương</option>
        </select></label
      >
    </div>
  </header>
  <div class="layout">
    <nav class="chapter-rail glass" id="chapterNav" aria-label="Chapters"></nav>
    <main class="reader glass" id="main">
      <div class="empty glass" id="placeholder">
        Đang tải… Cần mở qua <code>npm run catalog:view</code> với
        <code>?seriesId=ID&amp;c=SỐ_CHƯƠNG</code> (ID = <code>catalog_series.id</code>). Hoặc vào
        <a href="/">Catalog</a>.
      </div>
    </main>
  </div>
  <button
    type="button"
    class="scroll-top-btn"
    id="scrollTopBtn"
    aria-label="Lên đầu trang"
    aria-hidden="true"
    tabindex="-1"
    title="Lên đầu"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 19V5M5 12l7-7 7 7"
      />
    </svg>
  </button>
  <div id="readScrollPercent" class="read-scroll-pill" role="status" aria-live="polite" hidden>
    0%
  </div>
  <script src="/reader-sqlite.js" defer></script>
</body>
</html>
